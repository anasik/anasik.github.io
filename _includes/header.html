<header class="site-header" role="banner">
  <h1 class="site-title-main"><a href={{site.url}}>{{ site.title }}</a></h1>
  {%- include social.html -%}
</header>

<nav class="site-nav-corner" aria-label="Site navigation">
  <a href="/" class="nav-corner-link nav-corner-icon{% if page.url == '/' %} active{% endif %}" title="Home" aria-label="Home">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
  </a>
  <a href="/about" class="nav-corner-link{% if page.url == '/about.html' %} active{% endif %}">About</a>
  <a href="/list" class="nav-corner-link{% if page.url == '/list.html' %} active{% endif %}">Posts</a>
  <!-- <a href="/categories" class="nav-corner-link">Categories</a> -->
</nav>

<div class="theme-toggle" id="theme-toggle" role="group" aria-label="Theme">
  <button type="button" class="theme-option" data-theme-choice="light" title="Light" aria-label="Light theme">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
  </button>
  <button type="button" class="theme-option" data-theme-choice="dark" title="Dark" aria-label="Dark theme">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
  <button type="button" class="theme-option" data-theme-choice="system" title="System" aria-label="Match your system setting">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
  </button>
</div>

<script>
(function () {
  var STORAGE_KEY = 'theme-preference';
  var root = document.documentElement;
  var toggle = document.getElementById('theme-toggle');
  if (!toggle) return;
  var buttons = Array.prototype.slice.call(toggle.querySelectorAll('.theme-option'));

  function apply(choice) {
    if (choice === 'light' || choice === 'dark') {
      root.setAttribute('data-theme', choice);
    } else {
      root.removeAttribute('data-theme');
      choice = 'system';
    }
    buttons.forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme-choice') === choice);
    });
  }

  function setChoice(choice) {
    try {
      if (choice === 'system') {
        localStorage.removeItem(STORAGE_KEY);
      } else {
        localStorage.setItem(STORAGE_KEY, choice);
      }
    } catch (e) {}
    apply(choice);
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setChoice(btn.getAttribute('data-theme-choice'));
    });
  });

  var stored = null;
  try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  apply(stored);
})();
</script>

<button type="button" id="scroll-top-btn" class="scroll-top-btn" aria-label="Scroll to top" title="Scroll to top">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
</button>

<script>
(function () {
  var btn = document.getElementById('scroll-top-btn');
  if (!btn) return;
  var THRESHOLD = 400;

  function currentScroll() {
    return window.scrollY || document.documentElement.scrollTop || 0;
  }

  function updateVisibility() {
    btn.classList.toggle('visible', currentScroll() > THRESHOLD);
  }

  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  window.addEventListener('scroll', updateVisibility, { passive: true });
  updateVisibility();
})();
</script>
