<head>
  <script>
    // Applied before anything paints, so there's no flash of the wrong theme.
    // Absence of the attribute means "follow system" -- handled entirely by
    // the prefers-color-scheme media query in override.css.
    (function () {
      try {
        var stored = localStorage.getItem('theme-preference');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <!-- <link rel="stylesheet" href="{{ "/asets/main.css" | relative_url }}"> -->
  <link rel="stylesheet" href="{{ "/assets/override.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
